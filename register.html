
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#57158a">
<title>Create Account | Jovia Network</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --purple:#57158a;
    --purple-dark:#42106b;
    --purple-light:#f5effa;
    --gold:#f5b51b;
    --dark:#24152e;
    --muted:#82798a;
    --bg:#f8f7fb;
    --border:#e7e1eb;
    --white:#fff;
    --success:#197548;
    --danger:#a52a2a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:"Manrope",sans-serif;
    background:var(--bg);
    color:var(--dark);
    min-height:100vh;
}
a{text-decoration:none}
button,input{font-family:inherit}

header{
    width:min(1100px,92%);
    height:76px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}
.brand{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--purple);
}
.brand-icon{
    width:42px;
    height:42px;
    display:grid;
    place-items:center;
    border-radius:12px;
    background:linear-gradient(135deg,var(--purple),#7627a8);
    color:white;
    font-size:22px;
    font-weight:800;
}
.brand-name{
    display:block;
    font-size:21px;
    font-weight:800;
    line-height:1;
}
.brand-small{
    display:block;
    margin-top:4px;
    color:var(--muted);
    font-size:8px;
    font-weight:800;
    letter-spacing:3px;
}
.home-link{
    color:var(--purple);
    font-size:13px;
    font-weight:800;
}

main{
    width:100%;
    padding:35px 16px 55px;
}
.form-card{
    width:100%;
    max-width:510px;
    margin:auto;
    padding:34px;
    background:white;
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:0 15px 45px rgba(62,20,84,.07);
}
.heading{
    text-align:center;
    margin-bottom:27px;
}
.heading h1{
    color:var(--purple);
    font-size:27px;
    font-weight:800;
    letter-spacing:-.8px;
}
.heading p{
    margin-top:7px;
    color:var(--muted);
    font-size:12px;
}
.referral-banner{
    display:none;
    padding:12px 14px;
    margin-bottom:18px;
    background:var(--purple-light);
    border:1px solid #e5d7f0;
    border-radius:10px;
    color:var(--purple-dark);
    font-size:12px;
}
.form-message{
    display:none;
    padding:12px 14px;
    margin-bottom:17px;
    border-radius:10px;
    background:#fff0f0;
    border:1px solid #f0caca;
    color:var(--danger);
    font-size:12px;
    line-height:1.6;
}
.form-message.show{display:block}
.form-message.success{
    background:#effbf5;
    border-color:#c8ead8;
    color:var(--success);
}
.field{margin-bottom:17px}
.field label{
    display:block;
    margin-bottom:7px;
    font-size:12px;
    font-weight:800;
}
.input-wrap{position:relative}
.input-wrap input{
    width:100%;
    height:51px;
    padding:0 14px;
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
    background:#fcfbfd;
    color:var(--dark);
    font-size:13px;
    transition:.2s;
}
.input-wrap input:focus{
    border-color:var(--purple);
    background:white;
    box-shadow:0 0 0 3px rgba(87,21,138,.07);
}
.input-wrap input::placeholder{color:#aaa2ae}
.password-input{padding-right:52px!important}
.password-toggle{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    width:36px;
    height:36px;
    border:0;
    background:transparent;
    cursor:pointer;
    font-size:16px;
}
.package-title{
    margin:25px 0 12px;
    font-size:13px;
    font-weight:800;
}
.packages{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}
.package{position:relative}
.package input{
    position:absolute;
    opacity:0;
}
.package-label{
    display:block;
    position:relative;
    padding:17px;
    min-height:130px;
    border:1.5px solid var(--border);
    border-radius:13px;
    cursor:pointer;
    transition:.2s;
}
.package-label:hover{border-color:var(--purple)}
.package input:focus-visible+.package-label{
    outline:3px solid rgba(87,21,138,.2);
}
.package-type{
    display:block;
    color:var(--muted);
    font-size:9px;
    font-weight:800;
    margin-bottom:7px;
}
.package-name{
    display:block;
    font-size:20px;
    font-weight:800;
}
.package-price{
    display:block;
    margin-top:4px;
    color:var(--purple);
    font-size:18px;
    font-weight:800;
}
.package-bonus{
    display:block;
    margin-top:6px;
    color:var(--muted);
    font-size:9px;
    font-weight:700;
}
.package-check{
    position:absolute;
    top:12px;
    right:12px;
    width:23px;
    height:23px;
    display:grid;
    place-items:center;
    border:1px solid var(--border);
    border-radius:50%;
    color:transparent;
    font-size:11px;
}
#silver:checked+.package-label{
    background:var(--purple);
    border-color:var(--purple);
    color:white;
}
#silver:checked+.package-label .package-type,
#silver:checked+.package-label .package-price,
#silver:checked+.package-label .package-bonus{
    color:white;
}
#silver:checked+.package-label .package-check{
    border-color:white;
    color:white;
}
#gold:checked+.package-label{
    background:linear-gradient(135deg,#f8c52d,#e7a600);
    border-color:#e2a300;
    color:#351b00;
}
#gold:checked+.package-label .package-type,
#gold:checked+.package-label .package-price,
#gold:checked+.package-label .package-bonus{
    color:#351b00;
}
#gold:checked+.package-label .package-check{
    border-color:#351b00;
    color:#351b00;
}
.terms{
    display:flex;
    align-items:flex-start;
    gap:9px;
    margin:21px 0;
}
.terms input{
    width:16px;
    height:16px;
    min-width:16px;
    margin-top:2px;
    accent-color:var(--purple);
}
.terms label{
    color:var(--muted);
    font-size:10px;
    line-height:1.7;
}
.terms a{
    color:var(--purple);
    font-weight:800;
}
.continue-button{
    width:100%;
    height:54px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    border:0;
    border-radius:11px;
    background:linear-gradient(135deg,var(--purple),#7626a6);
    color:white;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}
.continue-button:hover:not(:disabled){
    transform:translateY(-1px);
    box-shadow:0 8px 20px rgba(87,21,138,.2);
}
.continue-button:disabled{
    opacity:.65;
    cursor:wait;
}
.login-link{
    margin-top:20px;
    padding-top:17px;
    border-top:1px solid #eee9f1;
    text-align:center;
    color:var(--muted);
    font-size:11px;
}
.login-link a{
    color:var(--purple);
    font-weight:800;
}
.secure{
    margin-top:12px;
    text-align:center;
    color:#938b99;
    font-size:9px;
}
.secure strong{color:var(--success)}
footer{
    padding:0 15px 25px;
    text-align:center;
    color:#98919d;
    font-size:10px;
}

@media(max-width:550px){
    header{height:68px;width:90%}
    .brand-icon{width:38px;height:38px}
    .brand-name{font-size:19px}
    main{padding:22px 13px 40px}
    .form-card{padding:25px 19px;border-radius:16px}
    .heading h1{font-size:24px}
    .packages{gap:9px}
    .package-label{padding:13px;min-height:125px}
    .package-name{font-size:18px}
    .package-price{font-size:16px}
}
@media(max-width:350px){
    .packages{grid-template-columns:1fr}
    .package-label{min-height:110px}
}
</style>
</head>

<body>

<header>
    <a href="index.html" class="brand">
        <div class="brand-icon">J</div>
        <div>
            <span class="brand-name">Jovia</span>
            <span class="brand-small">NETWORK</span>
        </div>
    </a>
    <a href="index.html" class="home-link">← Home</a>
</header>

<main>
<section class="form-card">

    <div class="heading">
        <h1>Create Account</h1>
        <p>Enter your details below to register with Jovia Network.</p>
    </div>

    <div id="referralBanner" class="referral-banner">
        Referred by: <strong id="referredByName"></strong>
    </div>

    <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>

    <form id="registrationForm" novalidate>

        <div class="field">
            <label for="fullName">Full Name</label>
            <div class="input-wrap">
                <input type="text" id="fullName"
                    placeholder="Enter your full name"
                    required maxlength="100" autocomplete="name">
            </div>
        </div>

        <div class="field">
            <label for="username">Username</label>
            <div class="input-wrap">
                <input type="text" id="username"
                    placeholder="Choose a username"
                    required minlength="3" maxlength="20"
                    pattern="[A-Za-z0-9_-]+"
                    autocomplete="username">
            </div>
        </div>

        <div class="field">
            <label for="email">Email Address</label>
            <div class="input-wrap">
                <input type="email" id="email"
                    placeholder="Enter your email address"
                    required maxlength="150" autocomplete="email">
            </div>
        </div>

        <div class="field">
            <label for="phone">Phone Number</label>
            <div class="input-wrap">
                <input type="tel" id="phone"
                    placeholder="Enter your phone number"
                    required maxlength="30" autocomplete="tel">
            </div>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
                <input type="password" id="password"
                    class="password-input"
                    placeholder="Create a password"
                    required minlength="8" maxlength="100"
                    autocomplete="new-password">
                <button type="button" class="password-toggle"
                    id="passwordToggle"
                    aria-label="Show password">👁</button>
            </div>
        </div>

        <div class="package-title">Choose Your Package</div>

        <div class="packages">

            <div class="package">
                <input type="radio" id="silver" name="plan" value="Silver">
                <label for="silver" class="package-label">
                    <span class="package-type">STANDARD</span>
                    <span class="package-name">Silver</span>
                    <span class="package-price">₦9,000</span>
                    <span class="package-bonus">Dashboard bonus: ₦9,000</span>
                    <span class="package-check">✓</span>
                </label>
            </div>

            <div class="package">
                <input type="radio" id="gold" name="plan" value="Gold">
                <label for="gold" class="package-label">
                    <span class="package-type">PREMIUM</span>
                    <span class="package-name">Gold</span>
                    <span class="package-price">₦15,000</span>
                    <span class="package-bonus">Dashboard bonus: ₦15,000</span>
                    <span class="package-check">✓</span>
                </label>
            </div>

        </div>

        <div class="terms">
            <input type="checkbox" id="terms" required>
            <label for="terms">
                I agree to the Jovia Network
                <a href="terms.html" target="_blank" rel="noopener">Terms &amp; Conditions</a>
                and confirm that my information is correct.
            </label>
        </div>

        <button type="submit" class="continue-button" id="continueButton">
            <span id="buttonText">Create Account</span>
            <span>→</span>
        </button>

        <div class="secure">
            <strong>✓ Secure Registration</strong>
        </div>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Sign In</a>
        </div>

    </form>
</section>
</main>

<footer>© 2026 Jovia Network. All rights reserved.</footer>

<script>
"use strict";

const $ = id => document.getElementById(id);

/* PASSWORD VISIBILITY */
$("passwordToggle").addEventListener("click",function(){
    const input=$("password");
    const showing=input.type==="password";
    input.type=showing?"text":"password";
    this.textContent=showing?"🙈":"👁";
    this.setAttribute("aria-label",showing?"Hide password":"Show password");
});

/* REFERRAL SYSTEM */
function createReferralCode(username){
    const clean=String(username).trim()
        .replace(/[^a-zA-Z0-9_-]/g,"").toUpperCase();

    return clean || "JV"+Math.random().toString(36).substring(2,8).toUpperCase();
}

function showMessage(text,success){
    const message=$("formMessage");
    message.textContent=text;
    message.classList.add("show");
    message.classList.toggle("success",Boolean(success));
}

const urlParams=new URLSearchParams(window.location.search);
const urlPlan=String(urlParams.get("plan")||"").trim().toLowerCase();
const refFromUrl=String(
    urlParams.get("ref")||urlParams.get("referral")||""
).trim();

let referredByCode=null;

if(refFromUrl){
    referredByCode=refFromUrl.toUpperCase();
    localStorage.setItem("jovia_referred_by",referredByCode);

    $("referredByName").textContent=referredByCode;
    $("referralBanner").style.display="block";

    fetch(`/api/referral/${encodeURIComponent(referredByCode)}`)
        .then(r=>r.json())
        .then(data=>{
            if(data&&data.username){
                $("referredByName").textContent=
                    data.username+" ("+referredByCode+")";
            }
        }).catch(()=>{});
}else{
    const savedRef=localStorage.getItem("jovia_referred_by");

    if(savedRef){
        referredByCode=savedRef;
        $("referredByName").textContent=savedRef;
        $("referralBanner").style.display="block";
    }
}

/* DEFAULT PACKAGE */
if(urlPlan==="gold"){
    $("gold").checked=true;
}else{
    $("silver").checked=true;
}

/* USERNAME VALIDATION */
$("username").addEventListener("input",function(){
    this.value=this.value.replace(/[^A-Za-z0-9_-]/g,"");
});

/* REGISTRATION */
$("registrationForm").addEventListener("submit",async function(event){
    event.preventDefault();

    const button=$("continueButton");
    const buttonText=$("buttonText");
    $("formMessage").classList.remove("show","success");

    const name=$("fullName").value.trim();
    const username=$("username").value.trim();
    const email=$("email").value.trim();
    const phone=$("phone").value.trim();
    const password=$("password").value;
    const selectedPlan=document.querySelector('input[name="plan"]:checked');

    if(!name||!username||!email||!phone||!password){
        showMessage("Please fill in all the required fields.",false);
        return;
    }

    if(username.length<3||username.length>20||
       !/^[A-Za-z0-9_-]+$/.test(username)){
        showMessage("Enter a valid username using 3–20 letters, numbers, underscores or hyphens.",false);
        $("username").focus();
        return;
    }

    if(!selectedPlan){
        showMessage("Please choose a package.",false);
        return;
    }

    if(password.length<8){
        showMessage("Your password must contain at least 8 characters.",false);
        $("password").focus();
        return;
    }

    if(!$("terms").checked){
        showMessage("Please agree to the Terms & Conditions.",false);
        return;
    }

    if(!this.checkValidity()){
        this.reportValidity();
        return;
    }

    const plan=selectedPlan.value==="Gold"?"Gold":"Silver";
    const apiPlan=plan.toLowerCase();
    const planPrice=plan==="Gold"?15000:9000;
    const welcomeBonus=plan==="Gold"?15000:9000;

    button.disabled=true;
    buttonText.textContent="Creating Account...";

    try{
        const response=await fetch("/api/register",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            credentials:"include",
            body:JSON.stringify({
                fullName:name,
                username:username,
                email:email,
                phone:phone,
                password:password,
                plan:apiPlan,
                package:plan,
                referred_by:referredByCode,
                referral_code:referredByCode,
                referredBy:referredByCode
            })
        });

        let data=null;
        try{
            data=await response.json();
        }catch{
            data=null;
        }

        if(!response.ok||!data||!data.success){
            showMessage(
                data&&data.message?data.message:
                "Unable to create your account. Please try again.",
                false
            );
            button.disabled=false;
            buttonText.textContent="Create Account";
            return;
        }

        const referralCode=createReferralCode(username);

        localStorage.setItem("jovia_name",name);
        localStorage.setItem("jovia_username",username);
        localStorage.setItem("jovia_email",email);
        localStorage.setItem("jovia_phone",phone);
        localStorage.setItem("jovia_plan",plan);
        localStorage.setItem("jovia_plan_price",String(planPrice));
        localStorage.setItem("jovia_welcome_bonus",String(welcomeBonus));
        localStorage.setItem("jovia_referral_code",referralCode);
        localStorage.setItem("jovia_status","Inactive");
        localStorage.setItem("jovia_registered_at",new Date().toISOString());

        localStorage.removeItem("jovia_password");

        showMessage("Account created successfully. Redirecting...",true);
        buttonText.textContent="Opening Dashboard...";

        setTimeout(()=>{
            window.location.href="dashboard.html";
        },900);

    }catch(error){
        console.error("Registration failed:",error);

        showMessage(
            "Unable to connect to the server. Check your internet connection and try again.",
            false
        );

        button.disabled=false;
        buttonText.textContent="Create Account";
    }
});
</script>

</body>
</html>
