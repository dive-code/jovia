<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOVIA Codes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f1f5f9;padding:12px}
.top{background:#0f172a;color:#fff;padding:16px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;max-width:500px;margin:0 auto 12px}
.container{max-width:500px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:16px;padding:18px}
input{width:100%;padding:13px;border:1.5px solid #e2e8f0;border-radius:10px;margin-bottom:10px;outline:none}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-weight:800;cursor:pointer}
.btn-black{background:#0f172a;color:#22c55e}
.btn-light{background:#f1f5f9;color:#0f172a}
.code-box{background:#0f172a;border-radius:12px;padding:16px;text-align:center;display:none;margin-top:12px}
.code{color:#22c55e;font-size:28px;font-weight:900;letter-spacing:2px;word-break:break-all}
.item{border:1.5px solid #f1f5f9;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.lock{position:fixed;inset:0;background:#0f172a;z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-box{background:#fff;width:100%;max-width:340px;border-radius:20px;padding:24px;text-align:center}
</style>
</head>
<body>

<div id="lock" class="lock"><div class="lock-box">
<h2>Admin Only</h2>
<input id="passInput" type="password" placeholder="Password" style="margin-top:14px">
<button class="btn btn-black" onclick="unlock()" style="margin-top:10px">Unlock</button>
<p id="passError" style="color:red;font-size:12px;margin-top:8px;display:none">Wrong password</p>
</div></div>

<div class="top"><h3>JOVIA CODES</h3><span style="font-size:10px;background:#22c55e;color:#000;padding:5px 10px;border-radius:20px;font-weight:800">ONE USE ONLY</span></div>

<div class="container">

<div class="card">
<h3 style="font-size:14px;margin-bottom:10px">Generate Code</h3>
<button class="btn btn-black" onclick="generate()">Generate New Code</button>
<div id="result" class="code-box">
<div style="color:#94a3b8;font-size:10px">ONE TIME CODE</div>
<div id="codeText" class="code"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
<button class="btn btn-light" onclick="copyCode()">Copy</button>
<button class="btn btn-light" onclick="shareCode()">WhatsApp</button>
</div>
</div>
</div>

<div class="card">
<h3 style="font-size:14px;margin-bottom:10px">Check Code</h3>
<input id="checkCode" placeholder="Paste code JOVIA-XXXXXX">
<button class="btn btn-black" onclick="validate()">Check / Mark as Used</button>
<div id="checkResult" style="text-align:center;font-weight:800;margin-top:10px;font-size:13px;min-height:20px"></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;margin-bottom:10px">
<h3 style="font-size:14px">All Codes</h3><span id="count" style="background:#f1f5f9;padding:4px 10px;border-radius:20px;font-size:12px">0</span>
</div>
<div id="list"></div>
<button class="btn btn-light" onclick="clearAll()" style="margin-top:10px;background:#fee2e2;color:#991b1b">Clear All</button>
</div>

</div>

<script>
// === YOUR PASSWORD HERE ===
const ADMIN_PASSWORD = "Jovia2024";

if(localStorage.getItem('jovia_ok')==='yes') document.getElementById('lock').style.display='none';
function unlock(){
  if(document.getElementById('passInput').value===ADMIN_PASSWORD){
    localStorage.setItem('jovia_ok','yes');
    document.getElementById('lock').style.display='none'; render();
  } else document.getElementById('passError').style.display='block';
}

function getCodes(){ try{return JSON.parse(localStorage.getItem('jovia_simple')||'[]')}catch{return []} }
function saveCodes(c){ localStorage.setItem('jovia_simple',JSON.stringify(c)) }
function genCode(){ const ch="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<6;i++) s+=ch[Math.floor(Math.random()*ch.length)]; return "JOVIA-"+s; }

let lastCode="";
function generate(){
  const code=genCode();
  const codes=getCodes();
  codes.unshift({code,used:false,created:new Date().toLocaleString(),used_at:''});
  saveCodes(codes);
  lastCode=code;
  document.getElementById('result').style.display='block';
  document.getElementById('codeText').innerText=code;
  render();
}

function render(){
  const codes=getCodes();
  document.getElementById('count').innerText=codes.length;
  document.getElementById('list').innerHTML=codes.map((c,i)=>`
    <div class="item">
      <div><b>${c.code}</b><br><span style="font-size:11px;color:#64748b">Created: ${c.created}${c.used?`<br>Used: ${c.used_at}`:''}</span></div>
      <div style="text-align:right"><span style="font-size:10px;padding:4px 8px;border-radius:20px;font-weight:800;background:${c.used?'#fee2e2':'#dcfce7'};color:${c.used?'#991b1b':'#166534'}">${c.used?'USED':'ACTIVE'}</span><br>
      <button onclick="toggle(${i})" style="margin-top:6px;border:none;background:#0f172a;color:#fff;padding:5px 10px;border-radius:6px;font-size:11px">${c.used?'Undo':'Mark Used'}</button></div>
    </div>`).join('') || '<p style="text-align:center;color:#94a3b8;font-size:12px;padding:15px">No codes yet</p>';
}

function toggle(i){ const codes=getCodes(); codes[i].used=!codes[i].used; codes[i].used_at=codes[i].used?new Date().toLocaleString():''; saveCodes(codes); render(); }
function copyCode(){ navigator.clipboard.writeText(lastCode); alert('Copied: '+lastCode); }
function shareCode(){ window.open('https://wa.me/?text='+encodeURIComponent('Your JOVIA Withdraw Code: '+lastCode+'\nONE USE ONLY'),'blank'); }

function validate(){
  const code=document.getElementById('checkCode').value.trim().toUpperCase();
  const r=document.getElementById('checkResult');
  if(!code){ r.innerHTML=''; return; }
  const codes=getCodes(); const f=codes.find(c=>c.code===code);
  if(!f){ r.innerHTML='<span style="color:#ef4444">❌ Invalid code</span>'; return; }
  if(f.used){ r.innerHTML=`<span style="color:#ef4444">❌ Already USED<br><span style="font-size:11px">Used on: ${f.used_at}</span></span>`; return; }
  r.innerHTML='<span style="color:#16a34a">✅ Valid & Active - Not used yet</span>';
  if(confirm(`Mark ${code} as USED now? No one fit use am again`)){
    f.used=true; f.used_at=new Date().toLocaleString(); saveCodes(codes); render();
    r.innerHTML=`<span style="color:#16a34a">✅ Now marked as USED<br><span style="font-size:11px">Used: ${f.used_at}</span></span>`;
  }
}

function clearAll(){ if(confirm('Delete all?')){ saveCodes([]); render(); document.getElementById('result').style.display='none'; } }
render();
</script>
</body>
</html>
