<!DOCTYPE html>
<html>
<head>
<title>JOVIA CODES ADMIN</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#0f0f0f;color:#fff;padding:20px}
.card{background:#1a1a1a;padding:20px;border-radius:12px;margin-bottom:20px;border:1px solid #333}
button{background:#00ff88;color:#000;padding:12px 20px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:5px}
input,select{padding:12px;width:100%;border-radius:8px;border:1px solid #444;background:#222;color:#fff;margin:5px 0}
.code{font-family:monospace;background:#000;padding:8px;border-radius:6px;margin:4px;display:inline-block;color:#00ff88}
.used{color:#ff4444} .valid{color:#00ff88}
</style>
</head>
<body>
<h2>🔐 JOVIA CODES ADMIN - FULL HISTORY</h2>
<div class="card">
<p>Admin Password: <b>JoviaAdmin@2026</b></p>
<input type="password" id="adminPass" value="JoviaAdmin@2026" placeholder="Admin Password">
</div>

<div class="card">
<h3>1. Generate Codes</h3>
<select id="type">
<option value="withdraw">WITHDRAW - JOVIA-XXXXXX (Free)</option>
<option value="silver">SUPER SILVER - SUPER-XXXXXXXX (16k)</option>
<option value="gold">SUPER GOLD - SUPER-XXXXXXXX (12k)</option>
</select>
<input type="number" id="count" value="5" min="1" max="50">
<button onclick="generate()">Generate Codes</button>
<div id="genResult"></div>
</div>

<div class="card">
<h3>2. Check Code</h3>
<input type="text" id="checkCode" placeholder="JOVIA-XXXXXX or SUPER-XXXXXXXX">
<button onclick="checkCode()">Check Code</button>
<div id="checkResult"></div>
</div>

<div class="card">
<h3>3. All Codes List</h3>
<button onclick="listCodes()">Load All Codes</button>
<div id="listResult"></div>
</div>

<script>
async function generate(){
  const type=document.getElementById('type').value;
  const count=document.getElementById('count').value;
  const password=document.getElementById('adminPass').value;
  const res=await fetch('/api/admin/codes/generate',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':password},body:JSON.stringify({type,count,adminPassword:password})});
  const data=await res.json();
  if(data.success){
    let html=`<p class="valid">Generated ${data.codes.length} codes - Total in DB: ${data.total}</p>`;
    data.codes.forEach(c=> html+=`<span class="code">${c.code}</span>`);
    document.getElementById('genResult').innerHTML=html;
  } else {
    document.getElementById('genResult').innerHTML=`<p class="used">${data.message}</p>`;
  }
}
async function checkCode(){
  const code=document.getElementById('checkCode').value.trim();
  const password=document.getElementById('adminPass').value;
  const res=await fetch('/api/admin/codes/check/'+code,{headers:{'x-admin-password':password}});
  const data=await res.json();
  if(data.exists){
    document.getElementById('checkResult').innerHTML=`<p>Code: <b>${data.code}</b><br>Type: ${data.type}<br>Price: ${data.price}<br>Status: ${data.used ? '<span class="used">USED by '+data.used_by+'</span>' : '<span class="valid">VALID</span>'}</p>`;
  } else {
    document.getElementById('checkResult').innerHTML=`<p class="used">INVALID - Not found. Total codes: ${data.total}</p>`;
  }
}
async function listCodes(){
  const password=document.getElementById('adminPass').value;
  const res=await fetch('/api/admin/codes/list',{headers:{'x-admin-password':password}});
  const data=await res.json();
  let html=`<p>Total: ${data.total}</p>`;
  data.codes.forEach(c=>{ html+=`<div style="border-bottom:1px solid #333;padding:8px"><span class="code">${c.code}</span> ${c.type} - ${c.used ? '<span class="used">USED by '+c.used_by+'</span>' : '<span class="valid">VALID</span>'}</div>`; });
  document.getElementById('listResult').innerHTML=html;
}
</script>
</body>
</html>
