<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jovia Network | Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
 --purple:#2a0f3d;
 --purple2:#4b1d6b;
 --purple-light:#f6f0fa;
 --gold:#f5b700;
 --gold-light:#ffe88a;
 --bg:#fbf8ff;
 --text:#1e1430;
 --muted:#8a8196;
 --white:#ffffff;
 --border:#ece6f1;
 --success:#16a34a;
}
body{
 font-family:"Poppins",sans-serif;
 background:var(--bg);
 color:var(--text);
 -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
.app{
 width:100%;
 max-width:680px;
 min-height:100vh;
 margin:auto;
 padding:20px 18px 115px;
}

/* TOP BAR */
.topbar{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:28px;
 background:rgba(255,255,255,0.9);
 backdrop-filter:blur(12px);
 border:1px solid var(--border);
 border-radius:18px;
 padding:14px 16px;
 box-shadow:0 8px 25px rgba(42,15,61,0.06);
}
.logo-area{display:flex;align-items:center;gap:12px}
.logo{
 width:44px;height:44px;
 border-radius:12px;
 background:linear-gradient(135deg,var(--purple),var(--purple2));
 display:flex;align-items:center;justify-content:center;
 font-size:20px;font-weight:900;color:white;
 box-shadow:0 8px 20px rgba(75,29,107,0.3);
}
.logo-name{font-size:16px;font-weight:800;color:var(--purple);letter-spacing:-0.3px}
.logo-sub{display:block;font-size:9px;letter-spacing:2.5px;color:var(--muted);font-weight:700;margin-top:1px}
.menu-btn{
 width:42px;height:42px;border-radius:50%;
 border:1px solid var(--border);
 background:#fff;
 color:var(--purple);
 font-size:18px;cursor:pointer;
 transition:0.2s;
}
.menu-btn:hover{background:var(--purple-light);transform:rotate(5deg)}

/* WELCOME */
.welcome{margin-bottom:20px;padding:0 4px}
.welcome-label{
 font-size:10px;font-weight:800;letter-spacing:1.6px;
 color:var(--muted);margin-bottom:6px;
 display:flex;align-items:center;gap:8px;
}
.welcome-label:before{content:"";width:22px;height:2px;background:var(--gold);border-radius:2px}
.welcome h1{font-size:28px;line-height:1.15;color:var(--purple);font-weight:800;letter-spacing:-0.8px}
.welcome h1 span{
 background:linear-gradient(135deg,#8a5c00,var(--gold));
 -webkit-background-clip:text;-webkit-text-fill-color:transparent;
 background-clip:text;
}

/* ACCOUNT CARD - PROFESSIONAL */
.account-card{
 position:relative;overflow:hidden;
 background:linear-gradient(145deg,#2f1347 0%,#4a1f6e 50%,#5e2a85 100%);
 border-radius:26px;
 padding:26px;
 color:white;
 box-shadow:0 20px 50px rgba(42,15,61,0.25),0 1px 0 rgba(255,255,255,0.1) inset;
 margin-bottom:22px;
 border:1px solid rgba(255,255,255,0.08);
}
.account-card:before{
 content:"";position:absolute;width:280px;height:280px;
 border-radius:50%;
 background:radial-gradient(circle,rgba(245,183,0,0.18) 0%,rgba(245,183,0,0) 70%);
 right:-80px;top:-90px;pointer-events:none;
}
.account-card:after{
 content:"";position:absolute;width:200px;height:200px;
 border-radius:50%;border:1px solid rgba(255,255,255,0.07);
 left:-90px;bottom:-90px;pointer-events:none;
}
.account-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-start}
.account-label{font-size:10px;letter-spacing:1.5px;opacity:.7;font-weight:700}
.account-balance{font-size:40px;font-weight:900;margin-top:6px;letter-spacing:-1.5px;line-height:1}
.plan-badge{
 position:relative;z-index:2;
 padding:8px 14px;border-radius:30px;
 background:linear-gradient(135deg,var(--gold),var(--gold-light));
 color:#2a1a00;font-size:11px;font-weight:900;
 box-shadow:0 4px 15px rgba(245,183,0,0.35);
 letter-spacing:0.3px;
}
.account-info{
 position:relative;z-index:2;margin-top:22px;
 padding-top:18px;border-top:1px solid rgba(255,255,255,0.12);
 display:grid;grid-template-columns:1fr 1fr;gap:16px;
}
.info-box small{display:block;color:rgba(255,255,255,.6);font-size:10px;margin-bottom:5px;font-weight:600;letter-spacing:0.8px}
.info-box strong{font-size:14px;font-weight:700}
.account-button{
 position:relative;z-index:2;width:100%;border:0;margin-top:20px;
 padding:15px;border-radius:14px;
 background:linear-gradient(135deg,#ffc400 0%,#ffe06b 100%);
 color:#2a1a00;font-size:14px;font-weight:800;cursor:pointer;
 box-shadow:0 8px 20px rgba(255,196,0,0.35);
 transition:0.2s;
}
.account-button:hover{transform:translateY(-1px);box-shadow:0 12px 25px rgba(255,196,0,0.45)}
.account-button:disabled{opacity:0.6;cursor:default;transform:none}

/* QUICK MENU - PROFESSIONAL */
.quick-title{
 font-size:15px;font-weight:800;color:var(--purple);
 margin:26px 0 14px;display:flex;align-items:center;gap:10px;
}
.quick-title:after{content:"";flex:1;height:1px;background:var(--border)}
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.quick{
 background:#fff;border:1px solid var(--border);
 border-radius:18px;padding:16px;
 display:flex;align-items:center;gap:13px;
 cursor:pointer;text-align:left;
 box-shadow:0 6px 20px rgba(42,15,61,0.04);
 transition:0.2s;
}
.quick:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(42,15,61,0.08);border-color:#ddd3e8}
.quick-icon{
 width:46px;height:46px;flex-shrink:0;border-radius:13px;
 background:linear-gradient(135deg,#fff8d6,#fff0a8);
 display:flex;align-items:center;justify-content:center;
 font-size:18px;color:#8a5c00;
 box-shadow:0 4px 10px rgba(245,183,0,0.15);
}
.quick strong{display:block;color:var(--purple);font-size:13px;margin-bottom:2px;font-weight:700}
.quick small{color:var(--muted);font-size:11px;font-weight:500}

/* REFERRAL - PROFESSIONAL */
.referral-card{
 background:white;border:1px solid var(--border);
 border-radius:22px;padding:20px;margin-top:22px;
 box-shadow:0 8px 25px rgba(42,15,61,0.05);
}
.referral-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.referral-heading h2{color:var(--purple);font-size:16px;font-weight:800;letter-spacing:-0.3px}
.referral-box{
 border:1.5px dashed #d9cfea;background:linear-gradient(135deg,#fdfbff,#f6f0ff);
 border-radius:14px;padding:14px;
}
.referral-label{font-size:9px;color:#9a8da8;letter-spacing:1.2px;font-weight:800;margin-bottom:7px}
.referral-url{color:var(--purple);font-size:12px;font-weight:700;line-height:1.5;word-break:break-all}
.referral-actions{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.copy{
 border:0;background:var(--purple);color:#fff;
 padding:12px 18px;border-radius:12px;font-size:12px;font-weight:700;cursor:pointer;
 transition:0.2s;box-shadow:0 6px 15px rgba(42,15,61,0.2);
}
.copy:hover{background:var(--purple2);transform:translateY(-1px)}
.ref-count{font-size:11px;color:var(--muted);background:var(--purple-light);padding:7px 12px;border-radius:20px;font-weight:600}

/* ACTIVITY - PROFESSIONAL */
.activity-section{margin-top:26px}
.activity-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.activity-head h2{color:var(--purple);font-size:16px;font-weight:800}
.activity-head button{
 background:var(--purple-light);border:1px solid var(--border);
 color:var(--purple);font-size:11px;font-weight:800;cursor:pointer;
 padding:7px 12px;border-radius:20px;transition:0.2s;
}
.activity-head button:hover{background:var(--purple);color:white}
.activity-item{
 background:white;border:1px solid var(--border);border-radius:18px;
 padding:16px;display:flex;align-items:center;justify-content:space-between;
 box-shadow:0 6px 20px rgba(42,15,61,0.04);
}
.activity-left{display:flex;align-items:center;gap:12px}
.activity-icon{
 width:44px;height:44px;border-radius:12px;
 background:linear-gradient(135deg,#f0e6ff,#e8d9ff);
 color:var(--purple);display:flex;align-items:center;justify-content:center;font-weight:800;
}
.activity-name{font-size:12px;font-weight:700;color:var(--purple)}
.activity-date{font-size:10px;color:var(--muted);margin-top:3px;font-weight:500}
.activity-amount{
 color:#8a5c00;font-size:13px;font-weight:800;
 background:#fff8d6;padding:6px 10px;border-radius:10px;
}

/* BOTTOM NAV - PROFESSIONAL */
.bottom-nav{
 position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
 width:calc(100% - 24px);max-width:500px;
 background:rgba(255,255,255,0.92);
 backdrop-filter:blur(20px);border:1px solid var(--border);
 border-radius:22px;
 padding:10px 8px;
 display:grid;grid-template-columns:repeat(4,1fr);
 z-index:100;
 box-shadow:0 15px 40px rgba(42,15,61,0.12);
}
.nav{
 border:0;background:none;color:#9a92a6;
 display:flex;flex-direction:column;align-items:center;gap:4px;
 font-size:10px;font-weight:700;cursor:pointer;transition:0.2s;
 padding:6px 0;border-radius:14px;
}
.nav-icon{width:36px;height:28px;display:flex;align-items:center;justify-content:center;font-size:20px;transition:0.2s}
.nav.active{color:var(--purple);background:var(--purple-light)}
.nav.active.nav-icon{color:var(--purple);transform:scale(1.1)}

@media(max-width:390px){
.app{padding-left:14px;padding-right:14px}
.welcome h1{font-size:24px}
.account-balance{font-size:34px}
.quick{padding:14px 11px}
}
</style>
</head>
<body>
<div class="app">
    <header class="topbar">
        <div class="logo-area">
            <div class="logo">J</div>
            <div>
                <div class="logo-name">Jovia</div>
                <span class="logo-sub">NETWORK</span>
            </div>
        </div>
        <button class="menu-btn" onclick="logout()" aria-label="Logout">↪</button>
    </header>

    <section class="welcome">
        <div class="welcome-label">MEMBER AREA</div>
        <h1>Hello, <span id="userName">Loading...</span></h1>
    </section>

    <section class="account-card">
        <div class="account-top">
            <div>
                <div class="account-label">AVAILABLE BALANCE</div>
                <div class="account-balance" id="balance">₦0</div>
            </div>
            <div class="plan-badge" id="planBadge">SILVER</div>
        </div>
        <div class="account-info">
            <div class="info-box">
                <small>ACCOUNT STATUS</small>
                <strong id="accountStatus">Pending</strong>
            </div>
            <div class="info-box">
                <small>WELCOME BONUS</small>
                <strong id="welcomeBonus">₦0</strong>
            </div>
        </div>
        <button class="account-button" id="paymentButton" onclick="activate()">Continue to Payment</button>
    </section>

    <div class="quick-title">Quick access</div>
    <div class="quick-grid">
        <button class="quick" onclick="openPage('withdraw.html')">
            <div class="quick-icon">₦</div>
            <div><strong>Withdraw</strong><small>Request payout</small></div>
        </button>
        <button class="quick" onclick="openPage('jobs.html')">
            <div class="quick-icon">◈</div>
            <div><strong>Available Jobs</strong><small>View opportunities</small></div>
        </button>
        <button class="quick" onclick="openPage('history.html')">
            <div class="quick-icon">◷</div>
            <div><strong>Transactions</strong><small>View activity</small></div>
        </button>
        <button class="quick" onclick="openPage('profile.html')">
            <div class="quick-icon">◍</div>
            <div><strong>My Profile</strong><small>Account settings</small></div>
        </button>
    </div>

    <section class="referral-card">
        <div class="referral-heading"><h2>Invite & Earn</h2></div>
        <div class="referral-box">
            <div class="referral-label">YOUR PERSONAL LINK</div>
            <div class="referral-url" id="referralLink">Loading...</div>
        </div>
        <div class="referral-actions">
            <button class="copy" onclick="copyReferral()">Copy Link</button>
            <div class="ref-count"><strong id="memberCount">0</strong> joined</div>
        </div>
    </section>

    <section class="activity-section">
        <div class="activity-head">
            <h2>Latest Activity</h2>
            <button onclick="openPage('history.html')">View All</button>
        </div>
        <div class="activity-item">
            <div class="activity-left">
                <div class="activity-icon">✓</div>
                <div>
                    <div class="activity-name" id="activityName">Account Created</div>
                    <div class="activity-date" id="activityDate">Pending activation</div>
                </div>
            </div>
            <div class="activity-amount" id="activityAmount">Pending</div>
        </div>
    </section>
</div>

<nav class="bottom-nav">
    <button class="nav active" onclick="openPage('dashboard.html')"><div class="nav-icon">⌂</div>Home</button>
    <button class="nav" onclick="openPage('jobs.html')"><div class="nav-icon">◈</div>Jobs</button>
    <button class="nav" onclick="openPage('history.html')"><div class="nav-icon">◷</div>History</button>
    <button class="nav" onclick="openPage('profile.html')"><div class="nav-icon">◍</div>Profile</button>
</nav>

<script>
let currentUser = null;
async function loadUser(){
    try{
        const response = await fetch("/api/me?t=" + Date.now(),{method:"GET",credentials:"include",cache:"no-store",headers:{"Accept":"application/json","Cache-Control":"no-cache"}});
        let data = null;
        try{data = await response.json();}catch(error){console.error("Invalid API response:",error);}
        if(response.status === 401 || response.status === 403){window.location.href = "login.html";return;}
        if(!response.ok ||!data){throw new Error("Unable to load account data.");}
        let user = null;
        if(data.user && typeof data.user === "object"){user = data.user;}
        else if(data.data && data.data.user && typeof data.data.user === "object"){user = data.data.user;}
        else if(data.member && typeof data.member === "object"){user = data.member;}
        else if(typeof data === "object" && (data.fullName || data.full_name || data.name || data.username || data.email || data.plan || data.package || data.id || data._id)){user = data;}
        if(!user){throw new Error("No member information was returned.");}
        currentUser = user;
        displayUser(currentUser,data);
    }catch(error){
        console.error("Dashboard loading error:",error);
        document.getElementById("userName").textContent = "Member";
        document.getElementById("accountStatus").textContent = "Unable to load";
        document.getElementById("planBadge").textContent = "SILVER";
        document.getElementById("balance").textContent = "₦0";
        document.getElementById("welcomeBonus").textContent = "₦0";
        document.getElementById("referralLink").textContent = "Referral link unavailable";
    }
}
function displayUser(user,apiData){
    if(!user){return;}
    const profile = (user.profile && typeof user.profile === "object")? user.profile : {};
    let fullName = firstText(user.fullName,user.fullname,user.full_name,user.displayName,user.display_name,user.memberName,user.member_name,user.name,profile.fullName,profile.full_name,profile.name);
    if(!fullName){
        const firstName = firstText(user.firstName,user.first_name,profile.firstName,profile.first_name);
        const lastName = firstText(user.lastName,user.last_name,profile.lastName,profile.last_name);
        fullName = (firstName + " " + lastName).trim();
    }
    if(!fullName){fullName = firstText(user.username,user.userName,user.user_name);}
    if(!fullName && user.email){fullName = String(user.email).split("@")[0];}
    document.getElementById("userName").textContent = fullName || "Member";
    const planValues = [user.plan,user.selectedPlan,user.selected_plan,user.membershipPlan,user.membership_plan,user.subscriptionPlan,user.subscription_plan,user.package,user.packageName,user.package_name,user.selectedPackage,user.selected_package,user.planName,user.plan_name,user.membership,user.tier,profile.plan,profile.package,profile.membershipPlan,apiData && apiData.plan,apiData && apiData.package,apiData && apiData.selectedPlan,apiData && apiData.selectedPackage];
    const packageName = detectPackage(planValues);
    const planBadge = document.getElementById("planBadge");
    planBadge.textContent = packageName.toUpperCase();
    const serverBonus = firstNumber(user.welcomeBonus,user.welcome_bonus,user.registrationBonus,user.registration_bonus,apiData && apiData.welcomeBonus,apiData && apiData.welcome_bonus);
    let welcomeBonus;
    if(Number.isFinite(serverBonus)){welcomeBonus = serverBonus;}else if(packageName === "Gold"){welcomeBonus = 15000;}else{welcomeBonus = 9000;}
    const walletBalance = firstNumber(user.walletBalance,user.wallet_balance,user.balance,user.wallet,apiData && apiData.walletBalance,apiData && apiData.wallet_balance,apiData && apiData.balance);
    const actualWallet = Number.isFinite(walletBalance)? walletBalance : 0;
    document.getElementById("balance").textContent = money(actualWallet);
    document.getElementById("welcomeBonus").textContent = money(welcomeBonus);
    const rawStatus = firstText(user.accountStatus,user.account_status,user.status,user.userStatus,user.user_status,apiData && apiData.accountStatus,apiData && apiData.account_status).toLowerCase();
    let statusText = "Pending";
    if(rawStatus === "approved" || rawStatus === "active" || rawStatus === "activated"){statusText = "Active";}else if(rawStatus === "suspended"){statusText = "Suspended";}
    document.getElementById("accountStatus").textContent = statusText;
    const paymentButton = document.getElementById("paymentButton");
    if(rawStatus === "approved" || rawStatus === "active" || rawStatus === "activated"){
        paymentButton.textContent = "Account Activated ✓";paymentButton.disabled = true;paymentButton.style.opacity = "0.7";paymentButton.style.cursor = "default";
    }else if(rawStatus === "suspended"){
        paymentButton.textContent = "Account Suspended";paymentButton.disabled = true;paymentButton.style.opacity = "0.7";paymentButton.style.cursor = "default";
    }else{
        paymentButton.textContent = "Continue to Payment";paymentButton.disabled = false;paymentButton.style.opacity = "1";paymentButton.style.cursor = "pointer";
    }
    if(rawStatus === "approved" || rawStatus === "active" || rawStatus === "activated"){
        document.getElementById("activityName").textContent = packageName + " welcome bonus";
        document.getElementById("activityDate").textContent = "Account activated";
        document.getElementById("activityAmount").textContent = "+" + money(welcomeBonus);
    }else if(rawStatus === "suspended"){
        document.getElementById("activityName").textContent = "Account Suspended";
        document.getElementById("activityDate").textContent = "Please contact support";
        document.getElementById("activityAmount").textContent = "—";
    }else{
        document.getElementById("activityName").textContent = packageName + " welcome bonus";
        document.getElementById("activityDate").textContent = "Pending activation";
        document.getElementById("activityAmount").textContent = "+" + money(welcomeBonus);
    }
    let referralCode = firstText(user.referralCode,user.referral_code,user.refCode,user.ref_code,user.inviteCode,user.invite_code,user.referralUsername,user.referral_username,profile.referralCode,profile.referral_code,user.username,user.userName,user.user_name,user.id,user._id,user.userId,user.user_id);
    referralCode = cleanCode(referralCode);
    if(!referralCode){
        const fallbackId = firstText(user.id,user._id,user.userId,user.user_id);
        if(fallbackId){referralCode = cleanCode("JV" + fallbackId);}
    }
    if(!referralCode){referralCode = cleanCode(localStorage.getItem("jovia_referral_code"));}
    if(referralCode){
        localStorage.setItem("jovia_referral_code",referralCode);
        const referralURL = buildReferralURL(referralCode);
        document.getElementById("referralLink").textContent = referralURL;
    }else{
        document.getElementById("referralLink").textContent = "Referral link unavailable";
    }
    const memberCount = firstNumber(user.memberCount,user.member_count,user.referralCount,user.referral_count,user.totalReferrals,user.total_referrals);
    if(Number.isFinite(memberCount) && memberCount >= 0){document.getElementById("memberCount").textContent = memberCount;}
}
function detectPackage(values){
    for(const value of values){const text = getPlanText(value);if(text.includes("gold")){return "Gold";}}
    for(const value of values){const text = getPlanText(value);if(text.includes("silver")){return "Silver";}}
    return "Silver";
}
function getPlanText(value){
    if(value === undefined || value === null){return "";}
    if(typeof value === "object"){return String(value.name || value.title || value.plan || value.package || value.packageName || value.slug || value.type || "").trim().toLowerCase();}
    return String(value).trim().toLowerCase();
}
function firstText(){
    const values = Array.from(arguments);
    for(const value of values){
        if(value === undefined || value === null){continue;}
        if(typeof value === "object"){continue;}
        const text = String(value).trim();
        if(text){return text;}
    }
    return "";
}
function firstNumber(){
    const values = Array.from(arguments);
    for(const value of values){
        if(value === undefined || value === null || value === ""){continue;}
        if(typeof value === "object"){continue;}
        const number = Number(value);
        if(Number.isFinite(number)){return number;}
    }
    return null;
}
function buildReferralURL(referralCode){
    const url = new URL("register.html",window.location.href);
    url.searchParams.set("ref",referralCode);
    return url.href;
}
function money(amount){
    const numericAmount = Number(amount);
    if(!Number.isFinite(numericAmount)){return "₦0";}
    return "₦" + numericAmount.toLocaleString("en-NG");
}
function cleanCode(value){
    return String(value || "").trim().replace(/[^a-zA-Z0-9_-]/g,"").toUpperCase();
}
async function copyReferral(){
    const link = document.getElementById("referralLink").textContent;
    if(!link || link === "Loading..." || link === "Referral link unavailable"){alert("Your referral link is not available yet.");return;}
    const button = document.querySelector(".copy");
    try{
        if(navigator.clipboard && window.isSecureContext){await navigator.clipboard.writeText(link);}
        else{
            const textarea = document.createElement("textarea");
            textarea.value = link;
            textarea.style.position = "fixed";textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.focus();textarea.select();
            const successful = document.execCommand("copy");
            document.body.removeChild(textarea);
            if(!successful){throw new Error("Copy failed.");}
        }
        const oldText = button.textContent;
        button.textContent = "Copied ✓";
        setTimeout(function(){button.textContent = oldText;},1800);
    }catch(error){
        console.error("Copy referral error:",error);
        alert("Unable to copy the referral link. Please copy it manually.");
    }
}
function openPage(page){window.location.href = page;}
function activate(){
    if(!currentUser){return;}
    const status = firstText(currentUser.accountStatus,currentUser.account_status,currentUser.status,currentUser.userStatus,currentUser.user_status).toLowerCase();
    if(status === "approved" || status === "active" || status === "activated"){return;}
    if(status === "suspended"){return;}
    window.location.href = "payment.html";
}
async function logout(){
    try{await fetch("/api/logout",{method:"POST",credentials:"include",headers:{"Accept":"application/json"}});}catch(error){console.error("Logout error:",error);}
    localStorage.removeItem("jovia_name");localStorage.removeItem("jovia_plan");localStorage.removeItem("jovia_username");localStorage.removeItem("jovia_status");localStorage.removeItem("jovia_referral_code");
    window.location.href = "login.html";
}
document.addEventListener("DOMContentLoaded",function(){loadUser();});
